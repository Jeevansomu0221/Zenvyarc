name: EAS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait
