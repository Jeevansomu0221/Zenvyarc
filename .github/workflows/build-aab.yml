name: Build AAB (Play Console)

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aab:
    name: Production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Bump versionCode
        id: version
        run: |
          BASE=$(node -e "console.log(require('./app.json').expo.android.versionCode || 1)")
          CODE=$((BASE + ${{ github.run_number }}))
          NAME=$(node -e "console.log(require('./app.json').expo.version)")
          PKG=$(node -e "console.log(require('./app.json').expo.android.package)")
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode=$CODE;
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
          "
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "### AAB build" >> "$GITHUB_STEP_SUMMARY"
          echo "- package: \`$PKG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionName: \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: \`$CODE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prebuild Android
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Verify package name
        run: |
          PKG=$(grep -o 'applicationId ["'\''][^"'\'']*' android/app/build.gradle | head -1 | sed 's/applicationId ["'\'']//')
          echo "Gradle applicationId=$PKG"
          test "$PKG" = "com.zenvy.arc"

      - name: Prepare signing
        run: bash scripts/ci-android-signing.sh

      - name: Bundle release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$CI_ANDROID_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$CI_ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CI_ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CI_ANDROID_KEY_PASSWORD"

      - name: Package artifact
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          cp android/app/build/outputs/bundle/release/*.aab \
            "dist/zenvyarc-play-v${VERSION}-${CODE}.aab"
          ls -lah dist

      - uses: actions/upload-artifact@v4
        with:
          name: zenvyarc-production-aab
          path: dist/zenvyarc-play-*.aab
          if-no-files-found: error
          retention-days: 30
