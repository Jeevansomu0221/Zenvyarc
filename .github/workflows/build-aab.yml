name: Build AAB (Play Console)

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Production AAB (EAS signed)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Bump versionName
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.version='1.0.4';
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
            console.log('versionName', j.expo.version, 'package', j.expo.android.package);
          "

      - name: Build signed AAB on EAS
        id: build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json 2>&1
          cat eas-build.json | tail -30
          node -e "
            const fs=require('fs');
            const raw=fs.readFileSync('eas-build.json','utf8');
            const start=raw.indexOf('[');
            if (start < 0) throw new Error('No JSON array in eas-build.json');
            const arr=JSON.parse(raw.slice(start));
            const b=arr[0]||arr;
            const url=b.artifacts?.applicationArchiveUrl||b.artifacts?.buildUrl;
            const id=b.id;
            const code=b.appBuildVersion;
            const ver=b.appVersion;
            if(!url) throw new Error('No AAB URL in build output');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url='+url+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'id='+id+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'code='+code+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ver='+ver+'\n');
            console.log('AAB URL:', url);
            console.log('versionName:', ver, 'versionCode:', code);
          "

      - name: Download AAB into runner
        run: |
          mkdir -p dist
          NAME="${{ steps.build.outputs.ver }}"
          CODE="${{ steps.build.outputs.code }}"
          OUT="dist/zenvyarc-play-v${NAME}-${CODE}.aab"
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "$OUT" \
            "${{ steps.build.outputs.url }}"
          ls -lah dist
          test -s "$OUT"
          echo "Saved $OUT ($(wc -c < "$OUT") bytes)"

      - name: Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenvyarc-production-aab
          path: dist/zenvyarc-play-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Play-ready AAB (EAS upload key)"
            echo "- package: \`com.zenvy.arc\`"
            echo "- versionName: \`${{ steps.build.outputs.ver }}\`"
            echo "- versionCode: \`${{ steps.build.outputs.code }}\`"
            echo "- **GitHub Artifacts:** scroll to **Artifacts** at the bottom of this run → download \`zenvyarc-production-aab\`"
            echo "- Expo mirror: ${{ steps.build.outputs.url }}"
            echo "- Build page: https://expo.dev/accounts/jeevansomu/projects/zenvyarc/builds/${{ steps.build.outputs.id }}"
          } >> "$GITHUB_STEP_SUMMARY"
