name: Build AAB (Play Console)

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure production build
        id: version
        run: |
          NAME=$(node -e "console.log(require('./app.json').expo.version)")
          # Always higher than previous Play uploads; run_number keeps it unique.
          CODE=$((30 + ${{ github.run_number }}))
          PKG=$(node -e "console.log(require('./app.json').expo.android.package)")

          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android.versionCode = $CODE;
            // Store AAB must not ship expo-dev-client (huge CI slowdown).
            j.expo.plugins = (j.expo.plugins || []).filter((p) => {
              const name = Array.isArray(p) ? p[0] : p;
              return name !== 'expo-dev-client';
            });
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            console.log(JSON.stringify({ package: j.expo.android.package, version: j.expo.version, versionCode: j.expo.android.versionCode }));
          "

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          {
            echo "### AAB build"
            echo "- package: \`$PKG\`"
            echo "- versionName: \`$NAME\`"
            echo "- versionCode: \`$CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prebuild Android
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Speed up Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          # CI speedups — phone ABIs only (skip x86 emulators)
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.enablePngCrunchInReleaseBuilds=false
          EOF

          PKG=$(grep -E "applicationId ['\"]" android/app/build.gradle | head -1 | sed -E "s/.*applicationId ['\"]([^'\"]+)['\"].*/\1/")
          echo "Gradle applicationId=$PKG"
          test "$PKG" = "com.zenvy.arc"

      - name: Prepare signing
        run: bash scripts/ci-android-signing.sh

      - name: Bundle release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$CI_ANDROID_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$CI_ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CI_ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CI_ANDROID_KEY_PASSWORD"

      - name: Package artifact
        run: |
          mkdir -p dist
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          test -n "$AAB" && test -f "$AAB"
          OUT="dist/zenvyarc-play-v${NAME}-${CODE}.aab"
          cp "$AAB" "$OUT"
          ls -lah dist
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`$OUT\` (package \`com.zenvy.arc\`, versionCode \`$CODE\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zenvyarc-production-aab
          path: dist/zenvyarc-play-*.aab
          if-no-files-found: error
          retention-days: 30
