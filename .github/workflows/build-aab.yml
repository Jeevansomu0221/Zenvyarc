name: Build AAB (Play Console)

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Production AAB (EAS signed)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure build
        id: version
        run: |
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.version='1.0.5';
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
          "

          NAME=$(node -e "console.log(require('./app.json').expo.version)")
          CODE=$((30 + ${{ github.run_number }}))

          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode=$CODE;
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
          "

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Speed up Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.enablePngCrunchInReleaseBuilds=false
          EOF

      - name: Prepare signing (Play upload key)
        env:
          REQUIRE_PLAY_KEYSTORE: "true"
        run: bash scripts/ci-android-signing.sh

      - name: Assemble release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease \
            --no-daemon --stacktrace --build-cache \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$CI_ANDROID_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$CI_ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CI_ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CI_ANDROID_KEY_PASSWORD"

      - name: Package artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/*.aab "dist/zenvyarc-play-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
          ls -lah dist
          test -s "dist/zenvyarc-play-*.aab"

      - name: Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenvyarc-production-aab
          path: dist/zenvyarc-play-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Play-ready AAB (Gradle signed with Play upload key)"
            echo "- package: \`com.zenvy.arc\`"
            echo "- versionName: \`${{ steps.version.outputs.name }}\`"
            echo "- versionCode: \`${{ steps.version.outputs.code }}\`"
            echo "- **GitHub Artifacts:** scroll to **Artifacts** at the bottom of this run → download \`zenvyarc-production-aab\`"
          } >> "$GITHUB_STEP_SUMMARY"
