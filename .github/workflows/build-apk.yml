name: Build APK (Preview)

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Configure build
        id: version
        run: |
          NAME=$(node -e "console.log(require('./app.json').expo.version)")
          CODE=$((30 + ${{ github.run_number }}))
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode=$CODE;
            j.expo.plugins=(j.expo.plugins||[]).filter(p=>{
              const n=Array.isArray(p)?p[0]:p; return n!=='expo-dev-client';
            });
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
          "
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Speed up Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.enablePngCrunchInReleaseBuilds=false
          EOF
          PKG=$(grep -E "applicationId ['\"]" android/app/build.gradle | head -1 | sed -E "s/.*applicationId ['\"]([^'\"]+)['\"].*/\1/")
          test "$PKG" = "com.zenvy.arc"

      - name: Prepare signing
        run: bash scripts/ci-android-signing.sh

      - name: Assemble release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace --build-cache \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$CI_ANDROID_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$CI_ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CI_ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CI_ANDROID_KEY_PASSWORD"

      - name: Package artifact
        run: |
          mkdir -p dist
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          cp android/app/build/outputs/apk/release/*.apk "dist/zenvyarc-preview-v${NAME}-${CODE}.apk"
          ls -lah dist

      - uses: actions/upload-artifact@v4
        with:
          name: zenvyarc-preview-apk
          path: dist/zenvyarc-preview-*.apk
          if-no-files-found: error
          retention-days: 30
