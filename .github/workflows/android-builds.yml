name: Android Builds (AAB + APK + Developer)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-builds.yml"
      - "app.json"
      - "eas.json"
      - "src/**"
      - "package.json"

concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aab:
    name: AAB (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start AAB build
        id: build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: |
          eas build --platform android --profile production --non-interactive --no-wait --json > eas-output.txt 2>&1
          BUILD_ID=$(node -e "const t=require('fs').readFileSync('eas-output.txt','utf8'); const m=t.match(/\"id\": \"([a-f0-9-]+)\"/g); const ids=m?m.map(x=>x.match(/\"id\": \"([a-f0-9-]+)\"/)[1]):[]; console.log(ids[0]||'');")
          if [ -z "$BUILD_ID" ]; then cat eas-output.txt; exit 1; fi
          BUILD_URL="https://expo.dev/accounts/jeevansomu/projects/zenvyarc/builds/$BUILD_ID"
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "### AAB build started" >> $GITHUB_STEP_SUMMARY
          echo "Track & download: $BUILD_URL" >> $GITHUB_STEP_SUMMARY
      - name: Print link
        run: echo "AAB → ${{ steps.build.outputs.url }}"

  apk:
    name: APK (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start APK build
        id: build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait --json > eas-output.txt 2>&1
          BUILD_ID=$(node -e "const t=require('fs').readFileSync('eas-output.txt','utf8'); const m=t.match(/\"id\": \"([a-f0-9-]+)\"/g); const ids=m?m.map(x=>x.match(/\"id\": \"([a-f0-9-]+)\"/)[1]):[]; console.log(ids[0]||'');")
          if [ -z "$BUILD_ID" ]; then cat eas-output.txt; exit 1; fi
          BUILD_URL="https://expo.dev/accounts/jeevansomu/projects/zenvyarc/builds/$BUILD_ID"
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "### APK build started" >> $GITHUB_STEP_SUMMARY
          echo "Track & download: $BUILD_URL" >> $GITHUB_STEP_SUMMARY
      - name: Print link
        run: echo "APK → ${{ steps.build.outputs.url }}"

  developer:
    name: Developer APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start Developer build
        id: build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: "1"
        run: |
          eas build --platform android --profile developer --non-interactive --no-wait --json > eas-output.txt 2>&1
          BUILD_ID=$(node -e "const t=require('fs').readFileSync('eas-output.txt','utf8'); const m=t.match(/\"id\": \"([a-f0-9-]+)\"/g); const ids=m?m.map(x=>x.match(/\"id\": \"([a-f0-9-]+)\"/)[1]):[]; console.log(ids[0]||'');")
          if [ -z "$BUILD_ID" ]; then cat eas-output.txt; exit 1; fi
          BUILD_URL="https://expo.dev/accounts/jeevansomu/projects/zenvyarc/builds/$BUILD_ID"
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "### Developer build started" >> $GITHUB_STEP_SUMMARY
          echo "Track & download: $BUILD_URL" >> $GITHUB_STEP_SUMMARY
      - name: Print link
        run: echo "Developer → ${{ steps.build.outputs.url }}"
